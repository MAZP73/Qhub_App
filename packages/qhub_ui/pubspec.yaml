name: qhub_ui
description: "Design system de Qhub para Flutter: tokens, tema claro/oscuro, íconos y widgets."
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  qhub_core:
    path: ../qhub_core
  qhub_api_client:
    path: ../qhub_api_client
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: false
  assets:
    - assets/icons/
    - assets/logos/
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
