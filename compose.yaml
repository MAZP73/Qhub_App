name: qhub_app

# Todo el entorno vive en el `.env` de la raíz (compose lo lee solo). Aquí se reparte a cada app con el prefijo que necesita.
x-web-env: &web-env
  VITE_APP_ENV: ${APP_ENV:?falta APP_ENV en .env}
  VITE_QHUB_API_BASE_URL: ${QHUB_API_URL:?falta QHUB_API_URL en .env}
  VITE_QHUB_WS_BASE_URL: ${QHUB_WS_URL:?falta QHUB_WS_URL en .env}
  VITE_SUPABASE_URL: ${SUPABASE_URL:?falta SUPABASE_URL en .env}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?falta SUPABASE_PUBLISHABLE_KEY en .env}
x-mobile-env: &mobile-env
  EXPO_PUBLIC_APP_ENV: ${APP_ENV:?falta APP_ENV en .env}
  EXPO_PUBLIC_SUPABASE_URL: ${SUPABASE_URL:?falta SUPABASE_URL en .env}
  EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?falta SUPABASE_PUBLISHABLE_KEY en .env}

x-node: &node
  build: { context: ., dockerfile: docker/Dockerfile.node }
  image: qhub_app/node
  working_dir: /workspace
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    HOME: /tmp/home
    npm_config_cache: /workspace/.npm-cache
  volumes:
    - .:/workspace

services:
  node:                        # herramientas (no se levanta solo): npm install · typecheck · test
    <<: *node
    profiles: [tools]
    command: ["bash"]

  web:                         # `docker compose up -d --build` → plataforma web de producción (nginx) en http://localhost:8080
    build: { context: ., dockerfile: docker/Dockerfile.web, args: *web-env }
    image: qhub_app/web
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 6

  android:                     # emulador de Android en el PC, con la pantalla en el navegador (http://localhost:6080). Se usa con `tool/emulator.sh`
    image: budtmo/docker-android:emulator_13.0
    profiles: [android]
    devices: ["/dev/kvm:/dev/kvm"]
    ports: ["127.0.0.1:6080:6080"]
    environment:
      EMULATOR_DEVICE: Samsung Galaxy S10
      WEB_VNC: "true"
    volumes: ["./apk:/apk:ro"]

  mobile:                      # también con `up -d --build`: bundle de producción de la app móvil (Android) servido con nginx en http://localhost:8082
    build: { context: ., dockerfile: docker/Dockerfile.mobile, args: *mobile-env }
    image: qhub_app/mobile
    restart: unless-stopped
    ports: ["127.0.0.1:8082:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/metadata.json"]
      interval: 15s
      timeout: 5s
      retries: 6

  qhub-api:                    # API local SIN credenciales reales: arranca, pero no opera
    build: { context: /home/miguelzambrano/projects/Qhub/qhub-api, dockerfile: dockerfile }
    image: qhub_app/qhub-api
    profiles: [local-api]
    environment:
      APP_ENV: development
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      RABBITMQ_URL: ""
      JWT_SECRET_KEY: "local-dev-secret-local-dev-secret-0123456789"
      ADMIN_API_KEY: "local-dev-admin-key-local-dev-admin-key-01"
      CORS_ORIGINS: "*"
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 20

  contract-tests:              # integración del cliente contra la API real en contenedor
    <<: *node
    profiles: [local-api]
    depends_on:
      qhub-api: { condition: service_healthy }
    environment:
      HOME: /tmp/home
      npm_config_cache: /workspace/.npm-cache
      QHUB_API_URL: http://qhub-api:8000
    command: ["bash", "-lc", "npm run test:integration -w @qhub/api-client"]

