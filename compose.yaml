name: qhub_app

x-node: &node
  build: { context: ., dockerfile: docker/Dockerfile.node }
  image: qhub_app/node
  working_dir: /workspace
  user: "${UID:-1000}:${GID:-1000}"
  environment:
    HOME: /tmp/home
    npm_config_cache: /workspace/.npm-cache
  volumes:
    - .:/workspace

services:
  node:                        # herramientas (no se levanta solo): npm install · typecheck
    <<: *node
    profiles: [tools]
    command: ["bash"]
